# PR gate: compiles the app and runs the non-network unit tests.
# The live-YouTube smoke tests are deliberately excluded here (they run on a
# schedule in extractor-smoke.yml) so PR checks never fail on throttling.
name: Build

# Skips commits that touch nothing the build can see — the site under docs/ is
# published by deploy-pages.yml, and prose has no bearing on whether the app
# compiles. Everything else, including gradle and manifest files, still runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests (non-network)
        run: >
          ./gradlew :app:testDebugUnitTest
          --tests "io.pickwick.app.AiScreenerTest"
          --tests "io.pickwick.app.ConfigStoreJsonTest"
          --tests "io.pickwick.app.RetryPolicyTest"
          --tests "io.pickwick.app.WhitelistParserTest"
          --tests "io.pickwick.app.WhitelistImporterUrlTest"
          --tests "io.pickwick.app.WhitelistExporterTest"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
