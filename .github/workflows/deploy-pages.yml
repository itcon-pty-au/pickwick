# Publishes site/ to pickwick.tv.
#
# This replaces GitHub's built-in "legacy" Pages builder, which fired on every
# push to main — a Kotlin-only commit rebuilt the site for nothing, and five
# pushes in eight minutes collided (Pages allows one deployment in flight, so
# the losers report `cancelled` or a 400 "due to in progress deployment").
# A workflow lets us filter on path and queue instead of collide.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # Channel-directory data is served live from the repo via raw CDN (see
      # directory.html), so a merged suggestion needn't rebuild the whole site.
      # A push that also touches real site files still deploys normally.
      - "!site/directory/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: every doc push should reach the live site, and a
# superseded deployment is what produced the failures this replaces.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # site/ is served verbatim — CNAME and .nojekyll ride along in the
      # artifact. No Jekyll step, so nothing rewrites the hand-written HTML.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
