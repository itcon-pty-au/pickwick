# Publishes site/ to pickwick.tv.
#
# This replaces GitHub's built-in "legacy" Pages builder, which fired on every
# push to main — a Kotlin-only commit rebuilt the site for nothing, and five
# pushes in eight minutes collided (Pages allows one deployment in flight, so
# the losers report `cancelled` or a 400 "due to in progress deployment").
# A workflow lets us filter on path and queue instead of collide.
#
# The repo's Pages *source* setting still reads `main /docs`, left over from
# that legacy builder. It is inert while build_type is `workflow` — this
# artifact is what serves pickwick.tv — and it cannot be corrected: the API
# accepts only `/` or `/docs`, never `/site`. Don't "tidy" it to `/`, which
# would publish the repo root (README, CLAUDE.md) if Pages were ever switched
# back to "Deploy from a branch". Switching back at all is the thing to avoid;
# the site would go stale and wrong, not merely unbuilt.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # Channel-directory data is served live from the repo via raw CDN (see
      # directory.html), so a merged suggestion needn't rebuild the whole site.
      # A push that also touches real site files still deploys normally.
      - "!site/directory/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: every doc push should reach the live site, and a
# superseded deployment is what produced the failures this replaces.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # site/ is served verbatim — CNAME and .nojekyll ride along in the
      # artifact. No Jekyll step, so nothing rewrites the hand-written HTML.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # The Pages backend intermittently takes 10-20+ minutes to process a
      # deployment (seen 2026-08-06; also community discussion #200817). The
      # action clamps its wait to a hard 10-minute maximum and *cancels* the
      # deployment when it trips, so one attempt turns backend slowness into
      # a failed deploy and a stale site. Retrying reuses the uploaded
      # artifact and opens another 10-minute window per attempt.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - id: retry2
        if: steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5
